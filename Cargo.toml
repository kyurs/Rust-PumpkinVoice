[package]
name = "pumpkin_voice"
version = "1.2.1"
edition = "2024"
authors = ["hmdnnrmn"]
description = "Simple Voice Chat integration for PumpkinMC"
license = "GPL-3.0"

[lib] 
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "204a94ed895f041a845630d5a23c094705a0704e", package = "pumpkin-plugin-api" }
wit-bindgen = "0.62"

# WASM compatible logging
tracing = "0.1"

# Crypto - need to ensure these are WASM compatible
# aes-gcm might need 'aes' and 'ghash' features or similar
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
rand = "0.10.2"

# UUID
uuid = { version = "1.26", features = ["v4", "serde"] }

# Bytes
bytes = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
unicode-general-category = "1.1"

[profile.release] 
lto = true
strip = "debuginfo"
codegen-units = 1
